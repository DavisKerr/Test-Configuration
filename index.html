<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Snake - HTML5 Arcade Game</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1 class="game-title">CYBER<span class="highlight">SNAKE</span></h1>
      <div class="hud">
        <div class="hud-card">
          <span class="hud-label">SCORE</span>
          <span id="score" class="hud-value">0000</span>
        </div>
        <div class="hud-card">
          <span class="hud-label">HIGH SCORE</span>
          <span id="high-score" class="hud-value">0000</span>
        </div>
        <div class="hud-card">
          <span class="hud-label">MULTIPLIER</span>
          <span id="multiplier" class="hud-value">1.0x</span>
        </div>
      </div>
    </header>

    <main class="game-board-wrapper">
      <div class="canvas-container">
        <canvas id="gameCanvas" width="480" height="480"></canvas>

        <!-- Start Overlay -->
        <div id="startModal" class="modal active">
          <div class="modal-content">
            <h2 class="modal-title">CYBER<span class="highlight">SNAKE</span></h2>
            <p class="modal-subtitle">NEON ARCADE EDITION</p>

            <div class="settings-group">
              <label for="difficultySelect">Difficulty:</label>
              <select id="difficultySelect">
                <option value="easy">Easy (Casual)</option>
                <option value="medium" selected>Medium (Standard)</option>
                <option value="hard">Hard (Fast)</option>
                <option value="insane">Insane (Cyber Speed)</option>
              </select>
            </div>

            <div class="settings-group">
              <label for="wallModeSelect">Walls:</label>
              <select id="wallModeSelect">
                <option value="solid" selected>Solid (Deadly)</option>
                <option value="wrap">Pass-Through (Wrap)</option>
              </select>
            </div>

            <div class="settings-group">
              <label for="obstacleSelect">Obstacles:</label>
              <select id="obstacleSelect">
                <option value="none" selected>None</option>
                <option value="few">Few</option>
                <option value="many">Many</option>
              </select>
            </div>

            <div class="settings-group toggle-group">
              <label for="soundToggle">Sound FX:</label>
              <button id="soundToggle" class="toggle-btn active">ON</button>
            </div>

            <button id="startBtn" class="primary-btn">START GAME</button>
          </div>
        </div>

        <!-- Pause Overlay -->
        <div id="pauseModal" class="modal hidden">
          <div class="modal-content">
            <h2 class="modal-title">GAME <span class="highlight">PAUSED</span></h2>
            <p class="modal-subtitle">Press ESC or Space to Resume</p>
            <div class="button-group">
              <button id="resumeBtn" class="primary-btn">RESUME</button>
              <button id="restartBtnPause" class="secondary-btn">RESTART</button>
            </div>
          </div>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverModal" class="modal hidden">
          <div class="modal-content">
            <h2 class="modal-title alert">GAME <span class="highlight-alert">OVER</span></h2>
            <div class="game-stats">
              <p>Final Score: <span id="finalScore" class="stat-highlight">0</span></p>
              <p>Best Score: <span id="finalHighScore" class="stat-highlight">0</span></p>
              <p id="newHighScoreNotice" class="new-high-score hidden">NEW HIGH SCORE! 🎉</p>
            </div>
            <button id="restartBtn" class="primary-btn">PLAY AGAIN</button>
          </div>
        </div>
      </div>

      <!-- Bonus active indicator -->
      <div id="bonusBarContainer" class="bonus-bar-container hidden">
        <span class="bonus-label">BONUS FOOD MULTIPLIER ACTIVE!</span>
        <div class="bonus-progress-bar"><div id="bonusProgress" class="bonus-progress"></div></div>
      </div>
    </main>

    <!-- Mobile D-Pad Controls -->
    <div class="dpad-container">
      <button id="btnUp" class="dpad-btn up" aria-label="Up">▲</button>
      <div class="dpad-middle">
        <button id="btnLeft" class="dpad-btn left" aria-label="Left">◄</button>
        <div class="dpad-center"></div>
        <button id="btnRight" class="dpad-btn right" aria-label="Right">►</button>
      </div>
      <button id="btnDown" class="dpad-btn down" aria-label="Down">▼</button>
    </div>

    <footer class="game-footer">
      <div class="controls-legend">
        <span><kbd>▲</kbd><kbd>▼</kbd><kbd>◄</kbd><kbd>►</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span>
        <span><kbd>Space</kbd> / <kbd>P</kbd> Pause</span>
        <span><kbd>M</kbd> Mute Sound</span>
      </div>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
